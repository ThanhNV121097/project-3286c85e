<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hello-word-22</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: Arial, Helvetica, sans-serif;
      display: grid;
      place-items: center;
    }
    main {
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1;
      font-weight: 400;
      text-align: center;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <main aria-label="Greeting screen">
    <h1>Hello Word</h1>
  </main>
</body>
</html>
